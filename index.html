/* ---- save code: carries history anywhere, storage or not ---- */
const TIDS=Object.keys(TOPICS).sort();
const c36=n=>Math.max(0,Math.min(35,n|0)).toString(36);
const i36=n=>("0"+Math.max(0,Math.min(1295,n|0)).toString(36)).slice(-2);
function makeCode(){
  if(!history) return "";
  let out="PR"+c36(history.sessions||0);
  TIDS.forEach((id,i)=>{
    const h=history.topics[id];
    if(h&&h.seen) out+=i36(i)+c36(h.seen)+c36(h.missed);
  });
  return out;
}
function readCode(code){
  code=(code||"").trim().replace(/\s+/g,"");
  if(!/^PR[0-9a-z]+$/i.test(code)||(code.length-3)%4!==0) return null;
  const out={sessions:parseInt(code[2],36)||0,topics:{}};
  for(let i=3;i<code.length;i+=4){
    const id=TIDS[parseInt(code.slice(i,i+2),36)];
    if(!id) return null;
    out.topics[id]={seen:parseInt(code[i+2],36),missed:parseInt(code[i+3],36)};
  }
  return out;
}
function refreshRestoreLabel(){
  const b=$("restore");
  if(!b||!history) return;
  const n=Object.keys(history.topics||{}).length;
  b.textContent=n?("Progress loaded \u2014 "+n+" topics tracked"):"Paste a save code";
}
function promptRestore(){
  const raw=window.prompt("Paste your save code:");
  if(raw===null) return;
  const parsed=readCode(raw);
  if(!parsed){ window.alert("That code was not readable. It should begin with PR."); return; }
  history=parsed; saveHistory(); refreshRestoreLabel();
  window.alert("Restored. "+Object.keys(parsed.topics).length+" topics carried over.");
}
async function saveHistory(){
  try{
    if(!history) return;
    window.localStorage.setItem("propjeop:history",JSON.stringify(history));
  }catch(e){}
}
function recordHistory(){
  if(!history) return;
  history.sessions=(history.sessions||0)+1;
  log.forEach(a=>{
    const h=history.topics[a.t]||(history.topics[a.t]={seen:0,missed:0});
    h.seen++; if(!a.ok) h.missed++;
  });
  saveHistory();
}

/* ---------- board ---------- */
function pickDailyDoubles(){
  ddSet=new Set();
  const r=DATA.rounds[roundIdx], total=r.categories.length*5;
  while(ddSet.size<r.dailyDoubles) ddSet.add(Math.floor(Math.random()*total));
}
const valueOf=ri=>DATA.rounds[roundIdx].base*(ri+1);
const key=(c,r)=>roundIdx+":"+c+":"+r;

function renderScore(){
  const el=$("score");
  el.innerHTML=(score<0?"\u2212":"")+"$"+Math.abs(score).toLocaleString()+"<small>score</small>";
  el.classList.toggle("neg",score<0);
  const r=DATA.rounds[roundIdx];
  const left=r.categories.length*5-Object.keys(done).filter(k=>k.startsWith(roundIdx+":")).length;
  $("tally").textContent=left+(left===1?" clue left":" clues left")+" \u2014 "+right+" right, "+wrong+" wrong";
}

function makeCell(ci,ri){
  const b=document.createElement("button");
  b.className="cellbtn";
  const v=valueOf(ri);
  b.textContent="$"+v;
  b.setAttribute("aria-label",DATA.rounds[roundIdx].categories[ci].title+", $"+v);
  if(done[key(ci,ri)]){b.disabled=true;b.textContent="";}
  else b.onclick=()=>openClue(ci,ri);
  return b;
}

function renderBoard(){
  const r=DATA.rounds[roundIdx];
  $("roundName").textContent=r.name;
  $("advance").textContent=roundIdx<DATA.rounds.length-1?("Skip to round "+(roundIdx+2)):"Skip to the final";
  board.innerHTML="";
  if(isNarrow()){
    r.categories.forEach((cat,ci)=>{
      const h=document.createElement("div");h.className="cat";h.textContent=cat.title;board.appendChild(h);
      const g=document.createElement("div");g.className="catgroup";
      cat.clues.forEach((_,ri)=>g.appendChild(makeCell(ci,ri)));
      board.appendChild(g);
    });
  }else{
    r.categories.forEach(cat=>{const h=document.createElement("div");h.className="cat";h.textContent=cat.title;board.appendChild(h);});
    for(let ri=0;ri<5;ri++) for(let ci=0;ci<r.categories.length;ci++) board.appendChild(makeCell(ci,ri));
  }
  renderScore();
}

/* ---------- clue flow ---------- */
function openClue(ci,ri){
  pendingKey=key(ci,ri);
  const cat=DATA.rounds[roundIdx].categories[ci];
  const item=cat.clues[ri], v=valueOf(ri);
  if(ddSet.has(ci*5+ri)) askWager(cat.title,item,v,true);
  else showClue(cat.title,item,v,false);
}

function askWager(catTitle,item,v,isDD){
  const cap=Math.max(score,v,DATA.rounds[roundIdx].base*5);
  sheet.innerHTML=`<div class="dd">Daily double</div>
    <div class="eyebrow">${esc(catTitle)}</div>
    <p class="clue">How much do you want to risk?</p>
    <input class="wager" id="wagerIn" type="number" min="0" max="${cap}" value="${v}" inputmode="numeric">
    <p class="hint">Anything up to $${cap.toLocaleString()}.</p>
    <div class="row"><button class="btn primary" id="wagerGo">See the clue</button></div>`;
  openVeil();
  const inp=$("wagerIn"); inp.focus(); inp.select();
  const go=()=>{let w=parseInt(inp.value,10); if(isNaN(w)||w<0)w=0; if(w>cap)w=cap; showClue(catTitle,item,w,isDD);};
  $("wagerGo").onclick=go;
  inp.onkeydown=e=>{if(e.key==="Enter")go();};
}

function showClue(catTitle,item,amount,isDD){
  sheet.innerHTML=`${isDD?'<div class="dd">Daily double</div>':""}
    <div class="eyebrow">${esc(catTitle)} <span class="amt">$${amount.toLocaleString()}</span></div>
    <p class="clue">${esc(item.clue)}</p>
    <div class="row"><button class="btn primary" id="revealBtn">Reveal the response</button></div>`;
  openVeil();
  $("revealBtn").focus();
  $("revealBtn").onclick=()=>reveal(catTitle,item,amount);
}

function reveal(catTitle,item,amount){
  sheet.innerHTML=`<div class="eyebrow">${esc(catTitle)} <span class="amt">$${amount.toLocaleString()}</span></div>
    <p class="clue">${esc(item.clue)}</p>
    <p class="answer">${esc(item.response)}</p>
    ${item.note?`<p class="note">${esc(item.note)}</p>`:""}
    <div class="row">
      <button class="btn good" id="gotIt">I had it</button>
      <button class="btn bad" id="missed">I missed it</button>
    </div>`;
  $("gotIt").focus();
  $("gotIt").onclick=()=>settle(true,amount,catTitle,item);
  $("missed").onclick=()=>settle(false,amount,catTitle,item);
}

function settle(ok,amount,catTitle,item){
  if(ok){score+=amount;right++;}else{score-=amount;wrong++;}
  log.push({t:item.t,k:item.k,ok,cat:catTitle,item});
  closeVeil();
  if(pendingFinal){pendingFinal=false;finish();return;}
  done[pendingKey]=true;
  renderBoard();
  const r=DATA.rounds[roundIdx];
  if(r.categories.length*5-Object.keys(done).filter(k=>k.startsWith(roundIdx+":")).length===0) nextRound();
}

function nextRound(){
  if(roundIdx<DATA.rounds.length-1){roundIdx++;pickDailyDoubles();renderBoard();}
  else startFinal();
}

function startFinal(){
  pendingFinal=true;
  const f=DATA.final, cap=Math.max(score,0);
  sheet.innerHTML=`<div class="dd">Final</div>
    <div class="eyebrow">${esc(f.category)}</div>
    <p class="clue">How much do you want to risk?</p>
    <input class="wager" id="wagerIn" type="number" min="0" max="${cap}" value="${cap}" inputmode="numeric">
    <p class="hint">${cap>0?"Anything up to $"+cap.toLocaleString()+".":"Your score is at or below zero, so the wager is zero."}</p>
    <div class="row"><button class="btn primary" id="wagerGo">See the clue</button></div>`;
  openVeil();
  const inp=$("wagerIn"); inp.focus(); inp.select();
  const go=()=>{let w=parseInt(inp.value,10); if(isNaN(w)||w<0)w=0; if(w>cap)w=cap; showClue(f.category,f,w,false);};
  $("wagerGo").onclick=go;
  inp.onkeydown=e=>{if(e.key==="Enter")go();};
}

/* ---------- diagnosis ---------- */
function tallyTopics(){
  const m={};
  log.forEach(a=>{const e=m[a.t]=m[a.t]||{seen:0,missed:0};e.seen++;if(!a.ok)e.missed++;});
  return m;
}
function tallyBy(fieldFn){
  const m={};
  log.forEach(a=>{const f=fieldFn(a);const e=m[f]=m[f]||{seen:0,missed:0};e.seen++;if(!a.ok)e.missed++;});
  return m;
}

function barRow(label,who,missed,seen,repeatNote){
  const pct=seen?Math.round(missed/seen*100):0;
  return `<div class="trow">
    <div class="tname">${esc(label)}${who?` <span class="who">${esc(who)}</span>`:""}${repeatNote?` <span class="repeat">${esc(repeatNote)}</span>`:""}</div>
    <div class="bar"><i class="${pct>=50?"":"warm"}" style="width:${Math.max(pct,4)}%"></i></div>
    <div class="tnum">${missed} of ${seen}</div>
  </div>`;
}

/* ---------- report ---------- */
function finish(){ recordHistory(); showReport(); }

function showReport(){
  $("boardArea").hidden=true;
  $("roundName").textContent="Report";
  const area=$("resultsArea"); area.hidden=false;

  const topics=tallyTopics();
  const weak=Object.entries(topics).filter(([,v])=>v.missed>0)
      .sort((a,b)=>(b[1].missed/b[1].seen)-(a[1].missed/a[1].seen)||b[1].missed-a[1].missed);

  const authors=Object.entries(tallyBy(a=>(TOPICS[a.t]||{}).author||"\u2014"))
      .filter(([,v])=>v.missed>0).sort((a,b)=>b[1].missed-a[1].missed);
  const kinds=Object.entries(tallyBy(a=>a.k))
      .filter(([,v])=>v.missed>0).sort((a,b)=>(b[1].missed/b[1].seen)-(a[1].missed/a[1].seen));

  const weakHtml=weak.length?weak.map(([id,v])=>{
    const T=TOPICS[id]||{label:id,author:""};
    let rep="";
    if(history&&history.topics[id]&&history.sessions>1){
      const h=history.topics[id];
      if(h.missed>v.missed) rep="also missed in earlier rounds";
    }
    return barRow(T.label,T.author,v.missed,v.seen,rep);
  }).join(""):`<p class="clean">Nothing to flag. Every topic came back clean.</p>`;

  const kindLine=kinds.length
    ? `The recall that broke down most often was <strong>${esc(kinds[0][0])}</strong>, at ${kinds[0][1].missed} of ${kinds[0][1].seen}. ${
        kinds[0][0]==="element list"?"That means the lists are not consolidated: drill them as complete sets rather than recognizing one member at a time."
        :kinds[0][0]==="exact wording"?"The concepts are there but the formulations are not. Those are the ones worth saying aloud until the phrasing is automatic."
        :kinds[0][0]==="attribution"?"You know the doctrine but lose track of who said it. On an essay that costs you the citation, not the analysis."
        :kinds[0][0]==="distinction"?"The individual rules are landing but the contrasts between them are not. Those contrasts are where the exam lives."
        :kinds[0][0]==="application"?"You can state the rules but not run them against facts. Work the hypotheticals, not the definitions."
        :"Work the definitions first; everything else is built on them."}`
    : "";

  const authorLine=authors.length
    ? `Most misses cluster on <strong>${esc(authors[0][0])}</strong>${authors.length>1?`, then ${esc(authors[1][0])}`:""}.`
    : "";

  const guideHtml=weak.length?weak.map(([id])=>{
    const T=TOPICS[id]; if(!T) return "";
    return `<div class="guide"><div class="gh">${esc(T.label)} <span class="who">${esc(T.author)}</span></div><p>${esc(T.brief)}</p></div>`;
  }).join(""):"";

  const drillCount=weak.reduce((n,[id])=>n+((TOPICS[id]&&TOPICS[id].drills)||[]).length,0);

  area.innerHTML=`<div class="results">
    <h2>Final score</h2>
    <div class="bigscore ${score<0?"neg":""}">${score<0?"\u2212":""}$${Math.abs(score).toLocaleString()}</div>
    <p class="tally">${right} right, ${wrong} wrong${history&&history.sessions?`, across ${history.sessions} session${history.sessions===1?"":"s"} on this device`:""}.</p>

    <section class="rep">
      <h3>Where it broke down</h3>
      <p class="sub">Topics you missed, worst rate first.</p>
      ${weakHtml}
    </section>

    ${(authorLine||kindLine)?`<section class="rep">
      <h3>The pattern</h3>
      <p class="sub" style="color:#D6CAB0;font-size:.97rem">${authorLine} ${kindLine}</p>
    </section>`:""}

    ${guideHtml?`<section class="rep">
      <h3>Study guide for what you missed</h3>
      <p class="sub">Read these before the drill.</p>
      ${guideHtml}
    </section>`:""}

    <section class="rep">
      <h3>Save code</h3>
      <p class="sub">Keep this and paste it at the start of your next round. It carries your miss history even if this page cannot store anything.</p>
      <p class="codebox" id="codeBox">${esc(makeCode())}</p>
      <div class="controls"><button class="btn" id="copyCode">Copy the code</button></div>
    </section>

    <div class="controls">
      ${drillCount?`<button class="btn primary" id="drillBtn">Drill these (${drillCount} questions)</button>`:""}
      <button class="btn" id="again">New board</button>
    </div>
  </div>`;

  if(drillCount) $("drillBtn").onclick=()=>startDrill(weak.map(([id])=>id));
  $("copyCode").onclick=async()=>{
    const code=makeCode(), b=$("copyCode");
    try{ await navigator.clipboard.writeText(code); b.textContent="Copied"; }
    catch(e){
      const r=document.createRange(); r.selectNodeContents($("codeBox"));
      const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      b.textContent="Selected \u2014 hold and copy";
    }
    setTimeout(()=>{b.textContent="Copy the code";},2200);
  };
  $("again").onclick=resetAll;
  renderScore();
}

function resetAll(){
  roundIdx=0;score=0;right=0;wrong=0;log=[];done={};pendingFinal=false;
  $("resultsArea").hidden=true; $("boardArea").hidden=false;
  pickDailyDoubles(); renderBoard();
}

/* ---------- drill ---------- */
let drill={items:[],i:0,ok:0,bad:[],sel:[]};

function startDrill(topicIds){
  const items=[];
  topicIds.forEach(id=>{
    const T=TOPICS[id]; if(!T||!T.drills) return;
    T.drills.forEach(d=>items.push(Object.assign({},d,{topic:id,label:T.label,author:T.author})));
  });
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
  drill={items,i:0,ok:0,bad:[],sel:[]};
  renderDrill();
}

function renderDrill(){
  const d=drill.items[drill.i];
  if(!d) return drillSummary();
  drill.sel=[];
  const multi=d.type==="pick";
  sheet.innerHTML=`
    <div class="eyebrow">${esc(d.label)} <span class="amt">${esc(d.author)}</span></div>
    <p class="prog">Question ${drill.i+1} of ${drill.items.length}</p>
    <p class="clue" style="font-size:1.32rem">${esc(d.prompt)}</p>
    <div id="opts" style="text-align:left;max-width:600px;margin:0 auto"></div>
    ${multi?`<div class="row"><button class="btn primary" id="check">Check</button></div>`:""}`;
  openVeil();
  const box=$("opts");
  d.options.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="opt"; b.type="button";
    b.innerHTML=`<span class="mk">${multi?"\u25a2":String.fromCharCode(65+i)}</span>${esc(o)}`;
    b.onclick=()=>{
      if(multi){
        const at=drill.sel.indexOf(i);
        if(at>-1){drill.sel.splice(at,1);b.classList.remove("sel");b.querySelector(".mk").textContent="\u25a2";}
        else{drill.sel.push(i);b.classList.add("sel");b.querySelector(".mk").textContent="\u25a3";}
      }else gradeDrill([i]);
    };
    box.appendChild(b);
  });
  if(multi) $("check").onclick=()=>gradeDrill(drill.sel.slice());
}

function gradeDrill(sel){
  const d=drill.items[drill.i];
  const want=d.type==="pick"?d.correct.slice().sort():[d.correct];
  const got=sel.slice().sort();
  const ok=want.length===got.length&&want.every((v,i)=>v===got[i]);
  if(ok)drill.ok++;else drill.bad.push(d);

  const opts=[...document.querySelectorAll("#opts .opt")];
  opts.forEach((b,i)=>{
    b.disabled=true;
    if(want.includes(i))b.classList.add("hit");
    else if(got.includes(i))b.classList.add("err");
  });
  const check=$("check"); if(check)check.remove();
  const tail=document.createElement("div");
  tail.innerHTML=`<p class="verdict ${ok?"ok":"no"}">${ok?"Right.":"Not it."}</p>
    <p class="why">${esc(d.why)}</p>
    <div class="row"><button class="btn primary" id="nextD">${drill.i+1<drill.items.length?"Next question":"See how it went"}</button></div>`;
  sheet.appendChild(tail);
  $("nextD").focus();
  $("nextD").onclick=()=>{drill.i++;renderDrill();};
}

function drillSummary(){
  const stillBad=[...new Set(drill.bad.map(d=>d.topic))];
  sheet.innerHTML=`
    <div class="eyebrow">Drill finished</div>
    <p class="clue" style="font-size:1.45rem">${drill.ok} of ${drill.items.length} correct</p>
    ${stillBad.length?`<p class="why">Still not sticking: ${stillBad.map(id=>esc((TOPICS[id]||{}).label||id)).join(", ")}.</p>`:`<p class="why">All of them came back. Those topics are consolidated.</p>`}
    <div class="row">
      ${stillBad.length?`<button class="btn primary" id="redrill">Drill just those again</button>`:""}
      <button class="btn" id="closeD">Back to the report</button>
    </div>`;
  if(stillBad.length) $("redrill").onclick=()=>startDrill(stillBad);
  $("closeD").onclick=()=>{closeVeil();};
}

/* ---------- boot ---------- */
$("advance").onclick=nextRound;
$("restore").onclick=promptRestore;
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!veil.hidden&&!pendingFinal&&drill.items.length===0) closeVeil();
});
let wasNarrow=isNarrow();
window.addEventListener("resize",()=>{
  const now=isNarrow();
  if(now!==wasNarrow){wasNarrow=now;if(!$("boardArea").hidden)renderBoard();}
});
loadHistory();
pickDailyDoubles();
renderBoard();

</script>
</body>
</html>
