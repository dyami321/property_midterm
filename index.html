  header.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 22px;border-bottom:2px solid var(--rubric-deep);padding-bottom:14px;margin-bottom:26px}
  header.top h1{font-size:1.5rem;font-weight:600;margin:0}
  header.top .round{color:var(--rubric);font-size:1.05rem}
  .spacer{flex:1}
  .score{font-size:1.35rem;color:var(--gilt);font-variant-numeric:tabular-nums}

  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .cat{background:var(--rubric-deep);color:var(--vellum);padding:14px 11px;min-height:92px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.95rem;line-height:1.25;border-top:3px solid var(--rubric)}
  .cellbtn{touch-action:manipulation;font-family:var(--serif);background:var(--cell);color:var(--gilt);border:0;border-top:1px solid #3a2c21;width:100%;padding:22px 6px;font-size:1.45rem;font-variant-numeric:tabular-nums;cursor:pointer;transition:background .12s ease}
  .cellbtn:hover:not(:disabled){background:var(--cell-hi)}
  .cellbtn:focus-visible{outline:3px solid var(--gilt);outline-offset:-3px}
  .cellbtn:disabled{background:#1F1711;color:#3a2e24;cursor:default}

  .controls{margin-top:24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .btn{touch-action:manipulation;font-family:var(--serif);font-size:1rem;background:transparent;color:var(--vellum);border:1px solid #4a392c;padding:9px 18px;cursor:pointer}
  .btn:hover{border-color:var(--gilt);color:var(--gilt)}
  .btn:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
  .btn.primary{background:var(--rubric);border-color:var(--rubric);color:var(--vellum)}
  .btn.primary:hover{background:var(--rubric-deep);color:var(--vellum)}
  .btn.good{border-color:var(--verdigris);color:var(--verdigris)}
  .btn.good:hover{background:var(--verdigris);color:var(--ink)}
  .btn.bad{border-color:var(--rubric);color:var(--rubric)}
  .btn.bad:hover{background:var(--rubric);color:var(--vellum)}
  .tally{color:var(--vellum-dim);font-size:.9rem}

  .veil{position:fixed;inset:0;height:100dvh;background:var(--vellum);color:#1F1912;display:block;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;z-index:50;padding:calc(22px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(26px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
  .veil[hidden]{display:none}
  .sheet{max-width:760px;width:100%;margin:0 auto;text-align:center;min-height:100%;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{color:var(--rubric);font-size:.95rem;margin-bottom:6px}
  .eyebrow .amt{color:#6b5a40}
  .clue{font-size:1.68rem;line-height:1.38;margin:16px 0 26px}
  .answer{font-size:1.4rem;color:var(--rubric-deep);border-top:2px solid #C9BB9C;padding-top:20px;margin-top:4px}
  .note{font-size:.92rem;color:#6b5a40;margin-top:14px;line-height:1.45}
  .sheet .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}
  .sheet .btn{border-color:#BBAA8A;color:#1F1912}
  .sheet .btn:hover{border-color:var(--rubric);color:var(--rubric)}
  .sheet .btn.primary{background:var(--rubric-deep);border-color:var(--rubric-deep);color:var(--vellum)}
  .sheet .btn.primary:hover{background:var(--rubric);color:var(--vellum)}
  .sheet .btn.good{border-color:#2F6657;color:#2F6657}
  .sheet .btn.good:hover{background:#2F6657;color:var(--vellum)}
  .sheet .btn.bad{border-color:var(--rubric);color:var(--rubric)}
  .sheet .btn.bad:hover{background:var(--rubric);color:var(--vellum)}
  .dd{color:var(--rubric);font-size:1.15rem;margin-bottom:10px}
  .wager{font-family:var(--serif);font-size:1.5rem;text-align:center;width:200px;padding:8px;border:1px solid #BBAA8A;background:#F6EFDC;color:#1F1912}
  .wager:focus-visible{outline:2px solid var(--rubric);outline-offset:1px}
  .hint{font-size:.9rem;color:#6b5a40;margin-top:8px}

  /* drill */
  .opt{touch-action:manipulation;display:block;width:100%;text-align:left;font-family:var(--serif);font-size:1.05rem;background:#F6EFDC;border:1px solid #CFC1A2;color:#1F1912;padding:11px 15px;margin-bottom:8px;cursor:pointer}
  .opt:hover{border-color:var(--rubric)}
  .opt:focus-visible{outline:2px solid var(--rubric);outline-offset:1px}
  .opt.sel{background:#E6D9B8;border-color:#8a7452}
  .opt.hit{background:#DCE9E2;border-color:#2F6657}
  .opt.err{background:#F0DAD8;border-color:var(--rubric)}
  .opt .mk{color:#6b5a40;margin-right:10px}
  .verdict{font-size:1.15rem;margin:18px 0 6px}
  .verdict.ok{color:#2F6657}
  .verdict.no{color:var(--rubric)}
  .why{font-size:1rem;color:#43382a;line-height:1.5;max-width:62ch;margin:0 auto}
  .prog{color:#6b5a40;font-size:.88rem}

  /* report */
  .results h2{font-size:1.55rem;margin:0 0 2px;font-weight:600}
  .bigscore{font-size:3.1rem;color:var(--gilt);font-variant-numeric:tabular-nums;line-height:1.1;margin:8px 0}
  .bigscore.neg{color:var(--rubric)}
  section.rep{margin-top:34px;max-width:78ch}
  section.rep h3{color:var(--rubric);font-size:1.08rem;margin:0 0 4px;font-weight:600}
  section.rep .sub{color:var(--vellum-dim);font-size:.9rem;margin:0 0 16px}
  .trow{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .tname{flex:0 0 auto;width:min(30ch,46%);font-size:.98rem}
  .tname .who{color:var(--vellum-dim);font-size:.82rem}
  .bar{flex:1;height:11px;background:#2C2119}
  .bar i{display:block;height:100%;background:var(--rubric)}
  .bar i.warm{background:var(--gilt)}
  .tnum{flex:0 0 auto;color:var(--vellum-dim);font-size:.85rem;width:12ch;text-align:right}
  .repeat{color:var(--gilt);font-size:.8rem}
  .guide{border-left:2px solid var(--rubric-deep);padding:2px 0 2px 16px;margin-bottom:22px;max-width:72ch}
  .guide .gh{font-size:1.02rem;margin-bottom:4px}
  .guide .gh .who{color:var(--vellum-dim);font-size:.84rem}
  .guide p{margin:0;color:#D6CAB0;font-size:.97rem;line-height:1.52}
  .clean{color:var(--verdigris)}
  .codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;line-height:1.6;word-break:break-all;background:#2C2119;border-left:2px solid var(--gilt);color:var(--gilt);padding:12px 14px;margin:0 0 12px;max-width:72ch;-webkit-user-select:all;user-select:all}

  @media (max-width:900px){
    body{font-size:16px}
    .board{grid-template-columns:1fr;gap:0}
    .cat{min-height:0;justify-content:flex-start;text-align:left;margin-top:14px;padding:10px 12px}
    .catgroup{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:5px}
    .cellbtn{padding:15px 2px;font-size:1rem;min-height:52px}
    .catgroup{gap:4px}
    .btn{padding:11px 18px}
    .opt{padding:13px 14px}
    .wager{width:170px}
    .controls{gap:10px}
    .controls .btn{flex:1 1 auto}
    .clue{font-size:1.28rem}
    .answer{font-size:1.12rem}
    .tname{width:100%}
    .trow{flex-wrap:wrap}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
